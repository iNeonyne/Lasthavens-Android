name: Engineering task
description: Track a concrete maintenance, testing, research or implementation task
title: "Task: "
labels: []
body:
  - type: markdown
    attributes:
      value: "Use this for work with a clear deliverable. Split independent work into separate issues only when ownership and file scope can be kept separate. The agent ownership label is applied automatically after creation; only Chaty assigns an implementation owner."
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What result must this task produce?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Exact work included. Name likely modules/files when known.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Verifiable conditions required before closing this issue.
      placeholder: |
        - [ ] Implementation/result is complete.
        - [ ] Relevant automated checks pass.
        - [ ] Documentation and evidence are updated.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Verification plan
      description: Tests, build checks, manual checks or research evidence required.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and blockers
      description: Related issue numbers, required decisions, APIs, access or hardware.
    validations:
      required: false
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and non-goals
      description: Compatibility, security, privacy, performance or scope limits.
    validations:
      required: false
  - type: input
    id: target
    attributes:
      label: Target release / milestone (optional)
      description: Leave unset if not yet scheduled.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched open and closed issues for duplicates.
          required: true
