name: LastHavenPlus Android build and signed releases

on:
  push:
    branches: [main, beta]
    tags: ["v*"]
    # Documentation-only edits do not need an Android build. Workflow/config/source
    # changes still run the complete verification pipeline.
    paths-ignore:
      - "*.md"
      - "**/*.md"
  pull_request:
    branches: [beta]
    paths-ignore:
      - "*.md"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version to create (for example 1.0.0). Leave empty for a normal CI build."
        required: false
        type: string

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default: jobs must declare the write permissions they need.
# Only create_tag and publish_release hold contents: write.
permissions:
  contents: read

jobs:
  # PR validation is intentionally read-only and does not access signing secrets
  # or upload/publish APKs. The normal beta push pipeline performs signed checks.
  pull_request_validation:
    if: github.event_name == 'pull_request'
    name: PR build and unit tests (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install Android 37.2 platform
        run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0"

      - name: Set up Gradle Wrapper
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1 (setup-gradle)
        with:
          gradle-version: wrapper
          validate-wrappers: true

      - name: Fetch beta formatting baseline
        run: git fetch --no-tags --depth=1 origin beta

      - name: Test release workflow helpers
        run: |
          python3 -m unittest discover -s .github/scripts/tests -v
          bash -n .github/scripts/prepare_release_payload.sh

      - name: Validate bundled GeckoView extension JavaScript
        run: |
          node --check app/src/main/assets/extensions/addon-bridge/background.js
          node --check app/src/main/assets/extensions/addon-bridge/payload-validation.js
          node --check app/src/main/assets/extensions/addon-bridge/bridge.js
          node --check app/src/main/assets/extensions/addon-bridge/xhr-overlay.js
          node --check app/src/main/assets/extensions/addon-bridge/worker-overlay.js
          node --check app/src/main/assets/extensions/addon-bridge/addon-bootstrap.js
          node --test scripts/test-addon-bridge.mjs
          node --test scripts/test-addon-xhr-overlay.mjs
          node --test scripts/test-addon-worker-overlay.mjs
          node --test scripts/test-addon-bootstrap.mjs

      - name: Generate resolved runtime dependency report
        run: |
          mkdir -p app/build/reports
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --stacktrace > app/build/reports/runtime-dependencies.txt

      - name: Run lint, formatting, unsigned release build and unit tests
        run: ./gradlew lintDebug spotlessCheck assembleRelease testDebugUnitTest --stacktrace -PspotlessRatchetFrom=origin/beta

      - name: Verify project rights, third-party notices and GeckoView about:license inventory in unsigned APK
        run: |
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned.apk' -print -quit)"
          test -n "$apk"
          python3 - "$apk" <<'PY'
          import sys
          import zipfile

          checks = {
              "project_rights_notice": (b"All rights reserved.", b"personal use"),
              "third_party_notices": (b"geckoview-arm64-v8a:161.0.20261118180411", b"passkey sign-in is unavailable"),
              "apache_2_0": (b"Apache License", b"Version 2.0"),
              "mpl_2_0": (b"Mozilla Public License", b"Version 2.0"),
              "geckoview_about_license_inventory": (
                  b"GeckoView 161 about:license",
                  b"Entries: 94",
                  b"Source HTML SHA-256: 036e7acd61cc5b7a4f88b6637d26269ffe20bb573a36b715bb98f31e7b70ccdf",
              ),
          }
          with zipfile.ZipFile(sys.argv[1]) as archive:
              table = archive.read("resources.arsc")
              resource_files = [name for name in archive.namelist() if name.startswith("res/")]
              for resource, markers in checks.items():
                  if resource.encode() not in table:
                      raise SystemExit(f"Missing resource-table entry: {resource}")
                  matches = [
                      name for name in resource_files
                      if all(marker in archive.read(name) for marker in markers)
                  ]
                  if not matches:
                      raise SystemExit(f"Missing packaged resource content: {resource}")
                  print(f"{resource}: {matches[0]}")
              omni = archive.read("assets/omni.ja")
              if b"chrome/toolkit/content/global/license.html" not in omni:
                  raise SystemExit("GeckoView about:license HTML is missing from assets/omni.ja")
          PY

      - name: Verify Addon Manager MIT notice in unsigned APK
        if: github.event_name == 'pull_request'
        run: |
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned.apk' -print -quit)"
          test -n "$apk"
          unzip -Z1 "$apk" | grep -Fx "assets/licenses/ADDON_MANAGER_0.5.1_MIT.txt"

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-unit-test-reports-${{ github.event.pull_request.number }}
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.sarif
            app/build/reports/runtime-dependencies.txt
            app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 14

  android_ui_smoke:
    if: github.event_name == 'pull_request'
    name: Android UI smoke (ARM64 POCO landscape profile)
    needs: pull_request_validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0"

      - name: Set up Gradle Wrapper
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1 (setup-gradle)
        with:
          gradle-version: wrapper
          validate-wrappers: true

      - name: Run UI smoke tests on an ARM64 Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: arm64-v8a
          profile: pixel_7_pro
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb shell wm size 2712x1220
            adb shell wm density 440
            ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload Android UI smoke reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-ui-smoke-${{ github.event.pull_request.number }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/apk/androidTest/
          if-no-files-found: ignore
          retention-days: 14

  dependency_report:
    if: github.event_name == 'workflow_dispatch'
    name: Resolved releaseRuntimeClasspath report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install Android 37.2 platform
        run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0"

      - name: Set up Gradle Wrapper
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1 (setup-gradle)
        with:
          gradle-version: wrapper
          validate-wrappers: true

      - name: Capture resolved releaseRuntimeClasspath
        run: ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --stacktrace > release-runtime-classpath.txt

      - name: Upload dependency report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-runtime-classpath-report
          path: release-runtime-classpath.txt
          if-no-files-found: error
          retention-days: 14

  create_tag:
    name: Create release tag
    if: (github.event_name == 'workflow_dispatch' && inputs.release_version != '' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release:'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_ref: ${{ steps.tag.outputs.tag_ref }}
    steps:
      - name: Validate version and create tag on selected main commit
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version || '' }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_VERSION" && "$COMMIT_MESSAGE" =~ \[release:([0-9]+\.[0-9]+\.[0-9]+)\] ]]; then
            RELEASE_VERSION="${BASH_REMATCH[1]}"
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use MAJOR.MINOR.PATCH, for example 1.0.0."
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$RELEASE_VERSION"
          if (( major > 999 || minor > 999 || patch > 999 )); then
            echo "::error::Each version component must be 999 or lower."
            exit 1
          fi
          tag="v$RELEASE_VERSION"
          if existing_release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" 2>/dev/null)"; then
            is_draft="$(jq -r '.draft' <<< "$existing_release")"
            release_id="$(jq -r '.id' <<< "$existing_release")"
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::A published release already exists for $tag; refusing to replace it."
              exit 1
            fi
            echo "Replacing existing unpublished draft release $tag (release $release_id)."
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id" >/dev/null
          else
            echo "No existing GitHub release for $tag; proceeding."
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" -f "sha=$GITHUB_SHA" -F "force=true" >/dev/null
            echo "Retargeted unpublished $tag to $GITHUB_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" >/dev/null
            echo "Created $tag at $GITHUB_SHA"
          fi
          echo "tag_ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: create_tag
    if: github.event_name != 'pull_request' && always() && (needs.create_tag.result == 'success' || needs.create_tag.result == 'skipped')
    name: Build and test (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Read-only job: release publishing moved to publish_release, the only
    # job besides create_tag that holds contents: write.
    permissions:
      contents: read
    outputs:
      is_release: ${{ steps.version.outputs.is_release }}
      release_tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.create_tag.outputs.tag_ref || github.ref }}
          # Full history is only needed to validate release-tag ancestry.
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/v') && '0' || '1' }}

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install Android 37.2 platform
        run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0"

      - name: Set up Gradle Wrapper
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1 (setup-gradle)
        with:
          gradle-version: wrapper
          validate-wrappers: true

      - name: Determine beta quality scope and fetch formatting baseline
        id: beta_quality
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
        env:
          SPOTLESS_RATCHET_REF: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SPOTLESS_RATCHET_REF" =~ ^[0-9a-f]{40}$ ]] || [[ "$SPOTLESS_RATCHET_REF" =~ ^0{40}$ ]]; then
            echo "::error::Could not determine a valid previous beta commit for formatting baseline."
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$SPOTLESS_RATCHET_REF"
          git cat-file -e "$SPOTLESS_RATCHET_REF^{commit}"
          if git diff --name-only "$SPOTLESS_RATCHET_REF" "$GITHUB_SHA" | grep -Eq '^(\.github/scripts/|app/src/|app/build.gradle.kts$|app/proguard-rules.pro$|build.gradle.kts$|settings.gradle.kts$|gradle/|gradlew$|gradle.properties$|\.github/workflows/quality.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Relevant source/build files changed; quality checks will run in this job."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "This beta change does not touch paths covered by lint/format checks; skipping those tasks."
          fi

      - name: Test release workflow helpers
        run: |
          python3 -m unittest discover -s .github/scripts/tests -v
          bash -n .github/scripts/prepare_release_payload.sh

      - name: Validate release tag belongs to stable main history
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Release tags must point to a commit already contained in stable main."
            exit 1
          fi

      - name: Resolve version metadata
        id: version
        shell: bash
        env:
          CREATED_TAG_REF: ${{ needs.create_tag.outputs.tag_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -n "$CREATED_TAG_REF" ]]; then
            tag="${CREATED_TAG_REF#refs/tags/}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag=""
          fi

          if [[ -n "$tag" ]]; then
            version="${tag#v}"
            if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::Release tags must use vMAJOR.MINOR.PATCH."
              exit 1
            fi
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            if (( major > 999 || minor > 999 || patch > 999 )); then
              echo "::error::Each version component must be 999 or lower."
              exit 1
            fi
            version_code=$((major * 1000000 + minor * 1000 + patch))
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            artifact_channel="stable"
          elif [[ "$GITHUB_REF" == "refs/heads/beta" ]]; then
            # Beta demo APKs must be installable over the latest stable app without
            # lowering versionCode. Reuse the stable identity, but keep this a CI
            # artifact only: is_release remains false, so no tag or release is created.
            stable_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
            if [[ ! "$stable_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::Latest stable release tag is not vMAJOR.MINOR.PATCH."
              exit 1
            fi
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            if (( major > 999 || minor > 999 || patch > 999 )); then
              echo "::error::Each stable version component must be 999 or lower."
              exit 1
            fi
            version="${stable_tag#v}"
            version_code=$((major * 1000000 + minor * 1000 + patch))
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            artifact_channel="beta"
            echo "Using latest stable version identity for beta demo: $version (versionCode $version_code)"
          else
            version="0.1.0"
            version_code="1"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            artifact_channel="ci"
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "artifact_channel=$artifact_channel" >> "$GITHUB_OUTPUT"
          echo "Building version $version (versionCode $version_code)"

      - name: Restore release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret" >&2; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD secret" >&2; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD secret" >&2; exit 1; }
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/lasthavenplus-release.jks" >> "$GITHUB_ENV"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lasthavenplus-release.jks"
          chmod 600 "$RUNNER_TEMP/lasthavenplus-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/lasthavenplus-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias lasthavenplus >/dev/null

      - name: Build signed optimized release APK and run unit tests
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/lasthavenplus-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          RUN_BETA_QUALITY: ${{ steps.beta_quality.outputs.run }}
          SPOTLESS_RATCHET_REF: ${{ github.event.before }}
        run: |
          set -euo pipefail
          GRADLE_TASKS=(assembleRelease testDebugUnitTest)
          GRADLE_ARGS=(--stacktrace "-PappVersionName=$APP_VERSION_NAME" "-PappVersionCode=$APP_VERSION_CODE")
          if [[ "$RUN_BETA_QUALITY" == "true" ]]; then
            GRADLE_TASKS=(lintDebug spotlessCheck "${GRADLE_TASKS[@]}")
            GRADLE_ARGS+=("-PspotlessRatchetFrom=$SPOTLESS_RATCHET_REF")
          fi
          ./gradlew "${GRADLE_TASKS[@]}" "${GRADLE_ARGS[@]}"

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports-${{ github.run_number }}
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.sarif
            app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify signing certificate, ABI and report APK sizes
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_ARTIFACT_CHANNEL: ${{ steps.version.outputs.artifact_channel }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'status=$?; echo "::error::Release verification failed at workflow line $LINENO (exit $status)"; exit "$status"' ERR
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          EXPECTED_CERT="b3bbf7520e77dfc384a60b1eee6c5f205b978f9b453849e2be523f642018d263"
          for apk in "$RELEASE_APK"; do
            echo "Checking APK exists: $apk"
            if [[ ! -f "$apk" ]]; then
              echo "::error::Expected APK was not produced: $apk"
              ls -lah app/build/outputs/apk/{debug,release}/ || true
              exit 1
            fi
            ls -lh "$apk"
            echo "Checking native ABI contents: $apk"
            python3 - "$apk" <<'PY'
          import sys, zipfile
          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as archive:
              abis = {
                  name.split("/")[1]
                  for name in archive.namelist()
                  if name.startswith("lib/") and name.endswith(".so") and len(name.split("/")) > 2
              }
              print(f"{apk}: packaged ABIs = {sorted(abis)}")
              if abis != {"arm64-v8a"}:
                  raise SystemExit(f"{apk}: expected arm64-v8a only, got {sorted(abis)}")
          PY
          done
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          echo "Checking apksigner executable: $APKSIGNER"
          if [[ ! -x "$APKSIGNER" ]]; then
            echo "::error::apksigner is missing or not executable"
            ls -lah "$ANDROID_HOME/build-tools/" || true
            exit 1
          fi
          echo "Verifying release APK signature"
          "$APKSIGNER" verify --verbose "$RELEASE_APK"
          echo "Reading release certificate fingerprint"
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$RELEASE_APK")"
          echo "$CERT_OUTPUT"
          CERT_DIGEST="$(printf '%s\n' "$CERT_OUTPUT" | awk '/certificate SHA-256 digest:/ {sub(/^.*certificate SHA-256 digest: /, ""); print tolower($0); exit}')"
          echo "Actual release certificate SHA-256: ${CERT_DIGEST:-<missing>}"
          echo "Expected release certificate SHA-256: $EXPECTED_CERT"
          if [[ "$CERT_DIGEST" != "$EXPECTED_CERT" ]]; then
            echo "::error::Release APK certificate does not match the established LastHaven release key."
            exit 1
          fi
          python3 - <<'PY'
          import os, zipfile
          apks = ["app/build/outputs/apk/release/app-release.apk"]
          summary = ["| APK | File size | DEX payload |", "|---|---:|---:|"]
          for apk in apks:
              with zipfile.ZipFile(apk) as archive:
                  dex_bytes = sum(
                      item.compress_size for item in archive.infolist()
                      if item.filename.endswith(".dex")
                  )
              size = os.path.getsize(apk)
              summary.append(
                  f"| {os.path.basename(os.path.dirname(apk))} | {size:,} bytes ({size / 1024 / 1024:.1f} MiB) | {dex_bytes / 1024 / 1024:.1f} MiB |"
              )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as report:
              report.write("\n## APK size report\n\n" + "\n".join(summary) + "\n")
          PY
          VERSIONED_APK="app/build/outputs/apk/release/LastHavenPlus-${APP_VERSION_NAME}-${APP_ARTIFACT_CHANNEL}-arm64-v8a.apk"
          cp "$RELEASE_APK" "$VERSIONED_APK"
          echo "Created version-qualified signed APK: $VERSIONED_APK"

      - name: Upload signed release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LastHavenPlus-${{ steps.version.outputs.name }}-${{ steps.version.outputs.artifact_channel }}-arm64-v8a
          path: app/build/outputs/apk/release/LastHavenPlus-${{ steps.version.outputs.name }}-${{ steps.version.outputs.artifact_channel }}-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30

      - name: Generate and verify differential release package
        if: steps.version.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.code }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: bash .github/scripts/prepare_release_payload.sh

      - name: Upload verified release payload
        if: steps.version.outputs.is_release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lasthavenplus-release-payload
          path: release-assets/
          if-no-files-found: error
          retention-days: 1

  publish_release:
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.is_release == 'true'
    name: Publish signed release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download verified release payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lasthavenplus-release-payload
          path: release-assets

      - name: Publish signed release and update assets
        id: release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          generate_release_notes: true
          draft: true
          files: release-assets/*
          fail_on_unmatched_files: true

      - name: Remove legacy duplicate release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Release action did not return a valid release ID for legacy asset cleanup."
            exit 1
          fi
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          while IFS= read -r asset_id; do
            [[ -n "$asset_id" ]] || continue
            echo "Deleting stale legacy asset ID $asset_id from release $RELEASE_ID"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          done < <(jq -r '.assets[] | select(.name == "lasthavenlauncher-arm64.apk" or .name == "lasthavenlauncher-update.json") | .id' <<< "$release_json")

      - name: Verify final draft contains exactly one APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Release action did not return a valid release ID."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RUNNER_TEMP/final-release.json"
          python3 .github/scripts/verify_release_assets.py "$RUNNER_TEMP/final-release.json" "$RELEASE_TAG"
