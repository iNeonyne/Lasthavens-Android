name: Keep roadmap synchronized

on:
  push:
    branches: [beta]
    paths: [.github/workflows/roadmap-sync.yml]
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  pull_request:
    types: [opened, edited, closed, reopened]
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: roadmap-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1

      - name: Generate roadmap from live GitHub state
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/generate_roadmap.py

      - name: Commit roadmap only when changed
        run: |
          if git diff --quiet -- ROADMAP.md; then
            echo "Roadmap already matches live GitHub state."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md
          git commit -m "docs: sync roadmap with live GitHub work"
          git push origin main
